name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: messages
          POSTGRES_PASSWORD: messages
          POSTGRES_DB: messages_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messages -d messages_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://messages:messages@localhost:5432/messages_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - name: Run server smoke against PostgreSQL
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          PORT: 3000
          SMOKE_URL: http://localhost:3000
        run: |
          pnpm --filter @messages/server migrate
          node apps/server/dist/index.js >/tmp/messages-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/health >/dev/null
          pnpm --filter @messages/server smoke
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: messages
          POSTGRES_PASSWORD: messages
          POSTGRES_DB: messages_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messages -d messages_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://messages:messages@localhost:5432/messages_e2e
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ github.run_id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
